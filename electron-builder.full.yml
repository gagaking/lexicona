appId: com.lexicona.app
productName: 辞谱 Lexicona
copyright: Copyright © 2026

directories:
  output: release-full
  buildResources: build_resources

electronLanguages:
  - en-US
  - zh-CN

files:
  - electron/**/*
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build_resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  installerIcon: build_resources/icon.ico
  uninstallerIcon: build_resources/icon.ico
  license: LICENSE

extraResources:
  - from: depth-anything-v2
    to: depth-anything-v2
    filter:
      - "**/*"
      - "!**/.git/**"
      - "!**/assets/**"
      - "!**/metric_depth/**"
      - "!**/app.py"
      - "!**/run.py"
      - "!**/run_video.py"
      - "!**/DA-2K.md"
      - "!**/README.md"
      - "!**/requirements.txt"
  - from: run_depth_anything.py
    to: run_depth_anything.py
  - from: build_resources/icon.ico
    to: icon.ico
  - from: build/depth-engine
    to: depth-engine
    filter:
      - "**/*"
      - "!**/_internal/torch/include/**"
      - "!**/_internal/torch/lib/*.lib"
      - "!**/_internal/torch/share/**"
  - from: models
    to: models
    filter:
      - "depth_anything_v2_vitl.pth"

publish: null

electronDist: node_modules/electron/dist
